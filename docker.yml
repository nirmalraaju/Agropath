services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agropath-backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    volumes:
      # Keep the model outside the Docker image
      - ./backend/models:/app/models:ro

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp

    networks:
      - agropath-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000

    container_name: agropath-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - agropath-network

networks:
  agropath-network:
    driver: bridge